<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHSG Portfolio Monitor - Google Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-slate-800">IHSG Portfolio Dashboard</h1>
            <p class="text-slate-500 italic">Data Source: Google Finance via Sheets</p>
        </header>

        <!-- Tambahan Navigasi Tab -->
<div class="flex gap-4 mb-6 border-b">
    <button onclick="switchTab('portfolio')" class="py-2 px-4 font-bold border-b-2 border-blue-600" id="tab-portfolio">Portfolio</button>
    <button onclick="switchTab('logs')" class="py-2 px-4 font-bold text-slate-500" id="tab-logs">Log Transaksi</button>
    <button onclick="switchTab('performance')" class="py-2 px-4 font-bold text-slate-500" id="tab-performance">Performance (PNL)</button>
</div>

<!-- SECTION PORTFOLIO -->
<div id="section-portfolio">
    <!-- Form Input (Update: Tambah Aksi Beli/Jual & Tanggal) -->
    <div class="bg-white p-6 rounded-xl shadow-sm border mb-6">
        <div class="grid grid-cols-1 md:grid-cols-6 gap-4">
            <input id="date" type="date" class="border p-2 rounded text-sm">
            <input id="ticker" type="text" placeholder="KODE" class="border p-2 rounded uppercase font-bold text-center">
            <select id="tradeType" class="border p-2 rounded bg-white">
                <option value="BUY">BELI (+)</option>
                <option value="SELL">JUAL (-)</option>
            </select>
            <input id="price" type="number" placeholder="Harga" class="border p-2 rounded">
            <input id="lots" type="number" placeholder="Lot" class="border p-2 rounded">
            <button onclick="processTrade()" class="bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">Eksekusi</button>
        </div>
        <!-- Setting Category (Hanya untuk Beli Baru) -->
        <div class="mt-4 flex gap-4 items-center">
            <select id="category" class="border p-2 rounded text-xs">
                <option value="Dividen">Dividen (Core)</option>
                <option value="Trading">Trading (Swing)</option>
            </select>
            <input id="initialInvestment" type="number" onchange="saveInitial()" placeholder="Total Modal Awal Rp" class="border-b p-1 text-sm w-64">
            <button onclick="updateAllPrices()" id="btnRefresh" class="bg-emerald-500 text-white px-4 py-1 rounded text-xs font-bold">Refresh Harga Google</button>
        </div>
    </div>

    <!-- Stats & Table Portfolio (Tetap seperti sebelumnya) -->
    <div id="portfolio-content">
        <!-- Render data portfolio di sini via JS -->
    </div>
</div>

<!-- SECTION LOGS -->
<div id="section-logs" class="hidden">
    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-slate-50 text-xs font-bold border-b">
                <tr>
                    <th class="p-4">Tanggal</th>
                    <th class="p-4">Emiten</th>
                    <th class="p-4">Tipe</th>
                    <th class="p-4">Harga</th>
                    <th class="p-4">Lot</th>
                    <th class="p-4">Total Value</th>
                </tr>
            </thead>
            <tbody id="logBody" class="text-sm"></tbody>
        </table>
    </div>
</div>

<!-- SECTION PERFORMANCE -->
<div id="section-performance" class="hidden">
    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-green-50 text-xs font-bold border-b">
                <tr>
                    <th class="p-4">Tanggal Jual</th>
                    <th class="p-4">Emiten</th>
                    <th class="p-4">Modal (Avg)</th>
                    <th class="p-4">Harga Jual</th>
                    <th class="p-4">Lot</th>
                    <th class="p-4 text-emerald-700">Realized PNL</th>
                </tr>
            </thead>
            <tbody id="performanceBody" class="text-sm"></tbody>
        </table>
    </div>
</div>

<script>
    const GOOGLE_SHEETS_CSV_URL = 'https://docs.google.com/spreadsheets/d/1-CyG-Lh-giK5XLdrNWXfr-FWHWWWSf699t4tAYTNdFM/edit?usp=drive_link';

    // Data Utama
    let portfolio = JSON.parse(localStorage.getItem('ihsg_v4_portfolio')) || [];
    let tradeLogs = JSON.parse(localStorage.getItem('ihsg_v4_logs')) || [];
    let realizedPNL = JSON.parse(localStorage.getItem('ihsg_v4_pnl')) || [];
    let livePrices = {};

    // 1. Logika Trade (Merge & PNL Calculation)
    function processTrade() {
        const date = document.getElementById('date').value || new Date().toISOString().split('T')[0];
        const ticker = document.getElementById('ticker').value.toUpperCase().trim();
        const type = document.getElementById('tradeType').value;
        const price = parseFloat(document.getElementById('price').value);
        const lots = parseInt(document.getElementById('lots').value);
        const category = document.getElementById('category').value;

        if(!ticker || isNaN(price) || isNaN(lots)) return alert("Data tidak lengkap!");

        // Tambah ke Log
        tradeLogs.push({ date, ticker, type, price, lots, total: price * lots * 100 });

        const existingIdx = portfolio.findIndex(s => s.ticker === ticker);

        if (type === 'BUY') {
            if (existingIdx > -1) {
                // Merge Position (Average Up/Down)
                const p = portfolio[existingIdx];
                const totalLots = p.lots + lots;
                const newAvg = ((p.buyPrice * p.lots) + (price * lots)) / totalLots;
                portfolio[existingIdx].lots = totalLots;
                portfolio[existingIdx].buyPrice = Math.round(newAvg);
            } else {
                // New Position
                portfolio.push({ ticker, buyPrice: price, lots, category, currentPrice: price });
            }
        } else if (type === 'SELL') {
            if (existingIdx > -1) {
                const p = portfolio[existingIdx];
                if (lots > p.lots) return alert("Lot penjualan melebihi lot yang dimiliki!");

                // Hitung Realized PNL
                const profitPerShare = price - p.buyPrice;
                const totalProfit = profitPerShare * lots * 100;
                realizedPNL.push({ date, ticker, avgAtBuy: p.buyPrice, sellPrice: price, lots, pnl: totalProfit });

                // Update atau Hapus dari Portfolio
                if (lots === p.lots) {
                    portfolio.splice(existingIdx, 1);
                } else {
                    portfolio[existingIdx].lots -= lots;
                }
            } else {
                return alert("Anda tidak memiliki emiten ini!");
            }
        }

        saveAll();
        renderAll();
    }

    // 2. Navigasi Tab
    function switchTab(tab) {
        document.getElementById('section-portfolio').classList.add('hidden');
        document.getElementById('section-logs').classList.add('hidden');
        document.getElementById('section-performance').classList.add('hidden');
        
        document.getElementById('section-' + tab).classList.remove('hidden');
    }

    // 3. Render Data
    function renderAll() {
        // Render Logs
        const logBody = document.getElementById('logBody');
        logBody.innerHTML = tradeLogs.slice().reverse().map(l => `
            <tr class="border-b">
                <td class="p-4">${l.date}</td>
                <td class="p-4 font-bold">${l.ticker}</td>
                <td class="p-4 ${l.type === 'BUY' ? 'text-blue-600' : 'text-orange-600'} font-bold">${l.type}</td>
                <td class="p-4">${l.price.toLocaleString()}</td>
                <td class="p-4">${l.lots}</td>
                <td class="p-4">Rp ${(l.total).toLocaleString()}</td>
            </tr>
        `).join('');

        // Render Performance
        const pnlBody = document.getElementById('performanceBody');
        pnlBody.innerHTML = realizedPNL.slice().reverse().map(p => `
            <tr class="border-b">
                <td class="p-4">${p.date}</td>
                <td class="p-4 font-bold">${p.ticker}</td>
                <td class="p-4">${p.avgAtBuy.toLocaleString()}</td>
                <td class="p-4">${p.sellPrice.toLocaleString()}</td>
                <td class="p-4">${p.lots}</td>
                <td class="p-4 font-bold ${p.pnl >= 0 ? 'text-emerald-600' : 'text-red-600'}">Rp ${p.pnl.toLocaleString()}</td>
            </tr>
        `).join('');

        // Render Portfolio tetap menggunakan fungsi sebelumnya yang sudah diupdate
        // ... (Logika renderPortfolio Anda panggil di sini)
    }

    function saveAll() {
        localStorage.setItem('ihsg_v4_portfolio', JSON.stringify(portfolio));
        localStorage.setItem('ihsg_v4_logs', JSON.stringify(tradeLogs));
        localStorage.setItem('ihsg_v4_pnl', JSON.stringify(realizedPNL));
    }

    // Gunakan fungsi updateAllPrices yang lama untuk fetch Google Sheets
    // window.onload = renderAll;
   </script>
</body>
</html>
